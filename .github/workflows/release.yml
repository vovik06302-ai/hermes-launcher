name: Release

on:
  push:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-build]'))
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag and package versions
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); const ref=process.env.GITHUB_REF; const tag=ref.startsWith('refs/tags/v') ? ref.slice('refs/tags/'.length) : 'v'+p.version; const version=tag.replace(/^v/,''); if(version!==p.version) throw new Error('Tag version '+tag+' does not match package.json '+p.version); if(p.version!==l.version || p.version!==l.packages[''].version) throw new Error('package.json, package-lock.json and packages[""] versions must match'); console.log('Release versions verified: '+p.version+' ('+tag+')');"

      - name: Install dependencies
        run: npm ci

      - name: Release preflight
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:RELEASE_TAG = $env:GITHUB_REF_NAME
          } else {
            $env:RELEASE_TAG = "v" + (node -p "require('./package.json').version")
          }
          npm run release:check

      - name: Quality tests
        run: npm run quality

      - name: Build unpacked application
        run: npm run dist:dir

      - name: Packaged smoke test
        run: npm run test:packaged

      - name: Build Windows installer + portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
        shell: pwsh
        run: |
          npx electron-builder --win nsis portable --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tag = "v" + (node -p "require('./package.json').version")
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Hermes Launcher $tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $assets = Get-ChildItem dist -File |
            Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -like 'latest*.yml' } |
            Select-Object -ExpandProperty FullName
          if (-not $assets) { throw "No Windows release assets were produced in dist/" }

          $uploaded = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            if ($attempt -lt 4) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $uploaded) { throw "GitHub Release asset upload failed after 4 attempts" }

      - name: Upload build outputs for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-launcher-${{ github.ref_name }}-build
          path: |
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: ignore

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-launcher-${{ github.ref_name }}-diagnostics
          path: |
            ${{ runner.temp }}/**/hermes-launcher.log
            dist/
          if-no-files-found: ignore
