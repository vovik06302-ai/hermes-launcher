name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag and package versions
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          $lockVersion = $lock.version
          $rootLockVersion = $lock.packages.''.version

          if ($tagVersion -ne $packageVersion) {
            throw "Tag version ($tagVersion) does not match package.json ($packageVersion)"
          }
          if ($packageVersion -ne $lockVersion -or $packageVersion -ne $rootLockVersion) {
            throw "package.json ($packageVersion), package-lock.json ($lockVersion) and packages[''] ($rootLockVersion) versions must match"
          }

      - name: Install dependencies
        run: npm ci

      - name: Release preflight
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check

      - name: Quality tests
        run: npm run quality

      - name: Build unpacked application
        run: npm run dist:dir

      - name: Packaged smoke test
        run: npm run test:packaged

      - name: Build and publish Windows installer + portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          DEBUG: electron-builder
        shell: pwsh
        run: |
          foreach ($name in 'WIN_CSC_LINK','WIN_CSC_KEY_PASSWORD','CSC_LINK','CSC_KEY_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
          }
          npx electron-builder --win nsis portable --publish always
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build outputs for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-launcher-${{ github.ref_name }}-build
          path: |
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: ignore

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-launcher-${{ github.ref_name }}-diagnostics
          path: |
            ${{ runner.temp }}/**/hermes-launcher.log
            dist/
          if-no-files-found: ignore
