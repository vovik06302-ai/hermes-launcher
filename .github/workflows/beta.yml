name: Beta
on:
  workflow_dispatch:
  push:
    tags: ['v*-beta*']
jobs:
  beta:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Release preflight
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check
      - name: Quality gates
        run: npm run quality
      - name: Build directory bundle
        run: npm run dist:dir
      - name: Packaged smoke test
        run: npm run test:packaged
      - name: Upload beta diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-launcher-beta-diagnostics
          path: |
            electron_log.txt
            .hermes-state.json
            dist/**
          if-no-files-found: warn
      - name: Publish prerelease
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          prerelease: true
          generate_release_notes: true
